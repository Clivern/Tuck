<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Tuck">
  <!-- Example cards tucked into a pocket -->
  <g transform="rotate(-14 40 70)">
    <rect x="18" y="14" width="44" height="58" rx="7" fill="#00ADD8"/>
    <rect x="26" y="24" width="20" height="5" rx="2.5" fill="#F9F9F7" opacity=".85"/>
  </g>
  <g transform="rotate(13 80 70)">
    <rect x="58" y="14" width="44" height="58" rx="7" fill="#F4B740"/>
    <rect x="66" y="24" width="24" height="5" rx="2.5" fill="#1C1B19" opacity=".55"/>
  </g>
  <rect x="36" y="6" width="48" height="62" rx="7" fill="#F9F9F7" stroke="#1C1B19" stroke-width="4"/>
  <rect x="44" y="16" width="18" height="5" rx="2.5" fill="#00ADD8"/>
  <rect x="44" y="26" width="30" height="5" rx="2.5" fill="#1C1B19"/>
  <rect x="50" y="36" width="20" height="5" rx="2.5" fill="#898781"/>
  <!-- Pocket with stitching -->
  <path d="M10 52q50 12 100 0v42a18 18 0 0 1-18 18H28a18 18 0 0 1-18-18z" fill="#1C1B19"/>
  <path d="M17 62q43 9 86 0v31a12 12 0 0 1-12 12H29a12 12 0 0 1-12-12z" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <!-- Prompt: chevron and cursor -->
  <path d="M38 72l14 10-14 10" fill="none" stroke="#F9F9F7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="89" width="24" height="7" rx="3.5" fill="#00ADD8"/>
</svg>
